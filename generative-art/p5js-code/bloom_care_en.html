<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bloom Care: Period of Flowers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#1b1b1b;display:flex;flex-direction:column;align-items:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eee;min-height:100vh;}
  h1{font-size:15px;font-weight:600;margin:18px 0 6px;color:#ddd;}
  #stage-tabs{display:flex;gap:8px;margin-bottom:14px;}
  #stage-tabs button{
    background:#2a2a2a;border:1px solid #444;color:#ccc;border-radius:20px;
    padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s;
  }
  #stage-tabs button.active{background:#f398c0;border-color:#f398c0;color:#1b1b1b;font-weight:600;}
  #canvas-wrap{
    background-image:
      linear-gradient(45deg,#333 25%,transparent 25%),
      linear-gradient(-45deg,#333 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#333 75%),
      linear-gradient(-45deg,transparent 75%,#333 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#222;border-radius:8px;overflow:hidden;
  }
  #controls{width:600px;max-width:92vw;margin:18px 0 40px;display:grid;
    grid-template-columns:110px 1fr 60px;row-gap:14px;column-gap:10px;align-items:center;font-size:13px;}
  #controls label{color:#bbb;}
  #controls input[type=range]{width:100%;accent-color:#f398c0;}
  #controls .val{text-align:right;color:#f398c0;font-variant-numeric:tabular-nums;}
  .hint{grid-column:1/4;font-size:11px;color:#777;margin-top:-8px;}
</style>
</head>
<body>
<h1>Four Stages of Period</h1>
<div id="stage-tabs">
  <button data-stage="menstrual" class="active">① Menstrual Stage</button>
  <button data-stage="follicular">② Follicular Stage</button>
  <button data-stage="ovulatory">③ Ovulatory Stage</button>
  <button data-stage="luteal">④ Luteal Stage</button>
</div>
<div id="canvas-wrap"></div>

<div id="controls">
  <label for="hr">Heart Rate</label>
  <input type="range" id="hr" min="40" max="160" value="70" step="1">
  <span class="val" id="hr-val">70 bpm</span>

  <label for="ox">Blood Oxygen</label>
  <input type="range" id="ox" min="80" max="100" value="97" step="1">
  <span class="val" id="ox-val">97</span>

  <label for="temp">Skin Temperature</label>
  <input type="range" id="temp" min="35.5" max="37.5" value="36.5" step="0.1">
  <span class="val" id="temp-val">36.5℃</span>

  <label for="act">Activity</label>
  <input type="range" id="act" min="0" max="100" value="10" step="1">
  <span class="val" id="act-val">10</span>
  <div class="hint">Higher activity makes the petals rotate more noticeably toward the flower's center, gathering and shrinking closed · Heart rate drives a breathing-like micro-pulse · Blood oxygen affects saturation · Skin temperature affects hue</div>
</div>

<script>
/* ================================================================
   Cycle Flower · Four stages, unified activity-driven open/close engine
   ----------------------------------------------------------------
   This version replaces ① Menstrual and ② Follicular stages with the
   data and folding method established in the "single-feature" demo
   (stigma spikes/connector lines/decorations removed, petals fuller,
   soft-glow edges). ③ Ovulatory and ④ Luteal stage petal shapes are
   kept exactly as-is (no paths removed), but how their "activity" is
   expressed has also been switched to the same engine: instead of
   "heart-rate-driven breathing + whole-flower scaling", it's now
   "activity → each petal rotates around its own pivot toward the
   flower center, gathering and shrinking".

   Two folding methods:
   - type:'generic' (Menstrual/Ovulatory/Luteal): the petal path's
     starting point = pivot; the farther from the flower center, the
     more pronounced the fold. This is the "path start as pivot"
     technique established in demos ① and ②.
   - type:'dual' (Follicular): the four central petals grow
     symmetrically around themselves, folded pinwheel-style using an
     "outward-facing vector"; the remaining tendrils/vines/small
     flowers use the generic technique.

   The petal gradients for the Ovulatory/Luteal stages still use the
   gradientTransform (matrix/translate/rotate combinations) from the
   original AI-exported code, so bakeGradient() is kept to precisely
   bake them into final coordinates at runtime using DOMMatrix — none
   of the gradient data has been changed.
   ================================================================ */

// ---------- Runtime matrix baking: precisely convert gradientTransform into final coordinates ----------
function parseSvgTransform(str) {
  let m = new DOMMatrix();
  const re = /(\w+)\(([^)]+)\)/g;
  let match;
  while ((match = re.exec(str)) !== null) {
    const type = match[1];
    const nums = match[2].trim().split(/[\s,]+/).map(Number);
    if (type === 'matrix') m = m.multiply(new DOMMatrix(nums));
    else if (type === 'translate') m = m.translate(nums[0], nums[1] || 0);
    else if (type === 'rotate') m = m.rotate(nums[0]);
  }
  return m;
}
function bakeGradient(g) {
  if (!g.transform) return { x1: g.x1, y1: g.y1, x2: g.x2, y2: g.y2 };
  const m = parseSvgTransform(g.transform);
  const p1x = m.a * g.x1 + m.c * g.y1 + m.e, p1y = m.b * g.x1 + m.d * g.y1 + m.f;
  const p2x = m.a * g.x2 + m.c * g.y2 + m.e, p2y = m.b * g.x2 + m.d * g.y2 + m.f;
  return { x1: p1x, y1: p1y, x2: p2x, y2: p2y };
}

// ---------- Path start point = pivot ----------
function parsePivot(d) {
  const m = d.match(/M\s*(-?[\d.]+)[,\s]+(-?[\d.]+)/);
  return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 300, y: 300 };
}

// ---------- Generic fold: rotate around path start point + gather toward flower center + shrink ----------
function applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp) {
  const closeAmt = 1 - openness;
  const dx = pivot.x - center.x;
  const dy = pivot.y - center.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const pull = Math.min(1, dist / fp.distDivisor) * closeAmt;

  const gatherX = -dx * pull * fp.gatherMul;
  const gatherY = -dy * pull * fp.gatherMul;
  const dirSign = dx >= 0 ? -1 : 1;
  const angle = dirSign * fp.angleMul * pull;
  const scale = (1 - fp.scaleMul * pull) * plumpness;

  ctx.translate(gatherX, gatherY);
  ctx.translate(pivot.x, pivot.y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.translate(-pivot.x, -pivot.y);
}

// ---------- Pinwheel-style fold (used for the four central petals of the Follicular stage) ----------
function applyPetalFoldCore(ctx, outward, openness, center, plumpness) {
  const closeAmt = 1 - openness;
  const gatherDist = 42;
  const gatherX = -outward.x * gatherDist * closeAmt;
  const gatherY = -outward.y * gatherDist * closeAmt;
  const angle = (outward.x - outward.y) * 0.65 * closeAmt;
  const scale = (1 - 0.62 * closeAmt) * plumpness;

  ctx.translate(gatherX, gatherY);
  ctx.translate(center.x, center.y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.translate(-center.x, -center.y);
}

// ================================================================
// Generic rendering engine
// ================================================================
let sketch = function (p) {
  let heartbeat = 70, bloodOxygen = 97, skinTemp = 36.5, activity = 10;
  let currentStage = 'menstrual';

  function fillWithGradient(ctx, path2d, stopArr, gradRaw, opacity, glowColor) {
    const g = bakeGradient(gradRaw);
    ctx.save();
    ctx.globalAlpha = opacity;
    if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 10; }
    ctx.clip(path2d);
    const grad = ctx.createLinearGradient(g.x1, g.y1, g.x2, g.y2);
    stopArr.forEach(([offset, color]) => grad.addColorStop(offset, color));
    ctx.fillStyle = grad;
    ctx.fillRect(-6000, -6000, 12000, 12000);
    ctx.restore();
  }

  // ---- generic type (Menstrual/Ovulatory/Luteal) ----
  function drawGenericStage(ctx, stage, openness) {
    const center = stage.flowerCenter, plumpness = stage.plumpness, fp = stage.fold;

    function drawItem(item) {
      const path2d = item._path2d || (item._path2d = new Path2D(item.d));
      const pivot = item._pivot || (item._pivot = parsePivot(item.d));
      ctx.save();
      applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp);
      fillWithGradient(ctx, path2d, stage.stops[item.stop], item.grad, item.opacity, stage.softGlow);
      ctx.restore();
    }

    for (const item of stage.center) drawItem(item);
    for (const item of stage.mirror) {
      const path2d = item._path2d || (item._path2d = new Path2D(item.d));
      const pivot = item._pivot || (item._pivot = parsePivot(item.d));

      ctx.save();
      applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp);
      fillWithGradient(ctx, path2d, stage.stops[item.stop], item.grad, item.opacity, stage.softGlow);
      ctx.restore();

      ctx.save();
      ctx.translate(600, 0);
      ctx.scale(-1, 1);
      applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp);
      fillWithGradient(ctx, path2d, stage.stops[item.stop], item.grad, item.opacity, stage.softGlow);
      ctx.restore();
    }
  }

  // ---- dual type (Follicular) ----
  function drawDualStage(ctx, stage, openness) {
    const center = stage.flowerCenter, plumpness = stage.plumpness, fp = stage.fold;

    for (const item of stage.mirror) {
      const path2d = item._path2d || (item._path2d = new Path2D(item.d));
      const pivot = item._pivot || (item._pivot = parsePivot(item.d));

      ctx.save();
      applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp);
      fillWithGradient(ctx, path2d, stage.flatStops, item.grad, item.opacity, stage.softGlow);
      ctx.restore();

      ctx.save();
      ctx.translate(600, 0);
      ctx.scale(-1, 1);
      applyPetalFoldGeneric(ctx, pivot, openness, center, plumpness, fp);
      fillWithGradient(ctx, path2d, stage.flatStops, item.grad, item.opacity, stage.softGlow);
      ctx.restore();
    }
    for (const petal of stage.corePetals) {
      const path2d = petal._path2d || (petal._path2d = new Path2D(petal.d));
      ctx.save();
      applyPetalFoldCore(ctx, petal.outward, openness, center, plumpness);
      fillWithGradient(ctx, path2d, stage.flatStops, petal.grad, 0.9, stage.softGlow);
      ctx.restore();
    }
  }

  // ---- Follicular stage background: egg cell (oocyte + zona pellucida + corona radiata) ----
  function drawEggCellBg(ctx, openness) {
    var cx = 300, cy = 272.6;
    var breathe = 0.9 + 0.1 * openness;
    var rx = 146 * breathe, ry = 140 * breathe;
    var t = p.millis() / 1000;

    ctx.save();

    /* ── Zona pellucida ── thick-membrane-feel double-layer ring */
    // Outer soft glow
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx + 18, ry + 18, 0, 0, Math.PI * 2);
    var zonaOuter = ctx.createRadialGradient(cx, cy, rx - 8, cx, cy, rx + 24);
    zonaOuter.addColorStop(0, 'rgba(195,170,240,0.0)');
    zonaOuter.addColorStop(0.25, 'rgba(195,170,240,0.10)');
    zonaOuter.addColorStop(0.6, 'rgba(180,155,228,0.16)');
    zonaOuter.addColorStop(1, 'rgba(165,140,215,0.0)');
    ctx.fillStyle = zonaOuter;
    ctx.fill();

    // Membrane outline (double line)
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx + 6, ry + 6, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(205,185,248,0.18)';
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 2, ry - 2, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,190,250,0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* ── Perivitelline space glimmer ── */
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx * 0.88, ry * 0.88, 0, 0, Math.PI * 2);
    var periGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx * 0.88);
    periGrad.addColorStop(0, 'rgba(235,225,255,0.05)');
    periGrad.addColorStop(1, 'rgba(215,200,248,0.015)');
    ctx.fillStyle = periGrad;
    ctx.fill();

    /* ── Corona radiata ── small dots around the membrane */
    var numDots = 26;
    for (var i = 0; i < numDots; i++) {
      var angle = (i / numDots) * Math.PI * 2 + 0.12;
      var jitter = Math.sin(i * 2.7 + t * 0.4) * 5;
      var dr = rx + 26 + jitter;
      var dry = ry + 26 + Math.cos(i * 1.9 + t * 0.3) * 5;
      var dx = cx + Math.cos(angle) * dr;
      var dy = cy + Math.sin(angle) * dry;
      var dotSize = 3.2 + Math.sin(i * 1.8) * 1.2;
      ctx.beginPath();
      ctx.arc(dx, dy, dotSize, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,180,240,0.13)';
      ctx.fill();
    }

    /* ── Polar body hint ── small circle inside the zona pellucida ── */
    var pbAngle = -Math.PI * 0.35;
    var pbx = cx + Math.cos(pbAngle) * (rx * 0.78);
    var pby = cy + Math.sin(pbAngle) * (ry * 0.78);
    ctx.beginPath();
    ctx.arc(pbx, pby, 9 * breathe, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(195,175,240,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,180,245,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ---- Ovulatory stage background: ovary shape (almond outline + follicle hints + fimbriae) ----
  function drawOvaryBg(ctx, openness) {
    var cx = 300, cy = 300;
    var breathe = 0.92 + 0.08 * openness;
    var w = 185 * breathe, h = 118 * breathe;
    var t = p.millis() / 1000;

    ctx.save();

    /* ── Main almond-shaped ovary body ── */
    ctx.beginPath();
    ctx.moveTo(cx - w, cy);
    // Upper arc
    ctx.bezierCurveTo(cx - w * 0.85, cy - h * 1.15, cx + w * 0.85, cy - h * 1.15, cx + w, cy);
    // Lower arc
    ctx.bezierCurveTo(cx + w * 0.85, cy + h * 1.15, cx - w * 0.85, cy + h * 1.15, cx - w, cy);
    ctx.closePath();

    // Cortex layer fill
    var cortexGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w);
    cortexGrad.addColorStop(0, 'rgba(255,215,225,0.05)');
    cortexGrad.addColorStop(0.5, 'rgba(255,195,210,0.035)');
    cortexGrad.addColorStop(1, 'rgba(255,175,200,0.015)');
    ctx.fillStyle = cortexGrad;
    ctx.fill();

    // Tunica albuginea outline
    ctx.strokeStyle = 'rgba(255,185,210,0.18)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    /* ── Fimbriae (right side) ── */
    ctx.beginPath();
    ctx.moveTo(cx + w - 8, cy - 18);
    ctx.bezierCurveTo(cx + w + 35, cy - 55, cx + w + 70, cy - 88, cx + w + 95, cy - 72);
    ctx.strokeStyle = 'rgba(255,185,215,0.14)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Fimbrial fringes
    var fimX = cx + w + 95, fimY = cy - 72;
    var fimAngles = [-0.9, -0.45, 0, 0.45];
    for (var fi = 0; fi < fimAngles.length; fi++) {
      var fa = fimAngles[fi] + Math.sin(t * 0.6 + fi) * 0.08;
      ctx.beginPath();
      ctx.moveTo(fimX, fimY);
      ctx.quadraticCurveTo(
        fimX + Math.cos(fa) * 14, fimY + Math.sin(fa) * 14,
        fimX + Math.cos(fa) * 22, fimY + Math.sin(fa) * 20
      );
      ctx.strokeStyle = 'rgba(255,185,215,0.10)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    /* ── Ovarian ligament (left side) ── */
    ctx.beginPath();
    ctx.moveTo(cx - w + 8, cy + 12);
    ctx.bezierCurveTo(cx - w - 25, cy + 35, cx - w - 55, cy + 48, cx - w - 75, cy + 42);
    ctx.strokeStyle = 'rgba(255,185,215,0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* ── Cortical follicle hints ── translucent circles of varying sizes ── */
    var follicles = [
      { x: -0.55, y: -0.35, r: 7.5 }, { x: 0.45, y: 0.4, r: 6 },
      { x: -0.65, y: 0.25, r: 4.5 }, { x: 0.6, y: -0.25, r: 8 },
      { x: -0.2, y: 0.55, r: 3.5 },  { x: 0.7, y: 0.12, r: 5 },
      { x: -0.35, y: -0.55, r: 5.5 },{ x: 0.18, y: -0.48, r: 4 },
      { x: -0.78, y: -0.05, r: 3.5 },{ x: 0.3, y: 0.58, r: 3 },
      { x: -0.48, y: 0.48, r: 4 },   { x: 0.55, y: -0.5, r: 3.5 }
    ];
    for (var i = 0; i < follicles.length; i++) {
      var f = follicles[i];
      var fx = cx + f.x * w * 0.72;
      var fy = cy + f.y * h * 0.68;
      var fr = f.r * breathe;
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,205,220,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,185,210,0.10)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    /* ── Ovulation point hint ── a larger ruptured follicle at upper right ── */
    var ovPtX = cx + w * 0.6, ovPtY = cy - h * 0.65;
    ctx.beginPath();
    ctx.arc(ovPtX, ovPtY, 11 * breathe, 0, Math.PI * 2);
    var ovGrad = ctx.createRadialGradient(ovPtX, ovPtY, 0, ovPtX, ovPtY, 11 * breathe);
    ovGrad.addColorStop(0, 'rgba(255,170,200,0.12)');
    ovGrad.addColorStop(0.6, 'rgba(255,190,215,0.06)');
    ovGrad.addColorStop(1, 'rgba(255,200,220,0.0)');
    ctx.fillStyle = ovGrad;
    ctx.fill();
    // Rupture opening
    ctx.beginPath();
    ctx.arc(ovPtX, ovPtY, 11 * breathe, -0.4, 0.6);
    ctx.strokeStyle = 'rgba(255,160,195,0.16)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawFlower(ctx, stageKey, openness) {
    const stage = STAGES[stageKey];
    p.push();
    p.translate(p.width / 2, p.height / 2);
    p.translate(-300, -300);

    // Biomorphic background layer
    if (stageKey === 'follicular') drawEggCellBg(ctx, openness);
    if (stageKey === 'ovulatory') drawOvaryBg(ctx, openness);

    if (stage.type === 'dual') drawDualStage(ctx, stage, openness);
    else drawGenericStage(ctx, stage, openness);
    p.pop();
  }

  function computeOpenness() {
    const minOpenness = 0.02;
    const midOpenness = 0.5;
    if (activity <= 15) return 1.0;
    if (activity <= 25) return p.map(activity, 15, 25, 1.0, midOpenness);
    return p.map(p.constrain(activity, 25, 100), 25, 100, midOpenness, minOpenness);
  }

  function computePulseAndFilter() {
    const pulseHz = heartbeat / 60;
    const pulseAmp = 0.025;
    const saturatePct = p.map(bloodOxygen, 80, 100, 70, 145);
    const hueDeg = p.map(skinTemp, 35.5, 37.5, -22, 22);
    const t = p.millis() / 1000;
    const pulse = 1 + pulseAmp * Math.sin(2 * Math.PI * pulseHz * t);
    return { pulse, saturatePct, hueDeg };
  }

  p.setup = function () {
    const cnv = p.createCanvas(600, 600);
    cnv.parent('canvas-wrap');
    p.pixelDensity(p.displayDensity());
  };

  p.draw = function () {
    p.clear();
    const ctx = p.drawingContext;
    const baseOpenness = computeOpenness();
    const { pulse, saturatePct, hueDeg } = computePulseAndFilter();
    const openness = baseOpenness * pulse; // Micro-pulse from heart rate layered on top of the activity-driven openness
    ctx.filter = `saturate(${saturatePct}%) hue-rotate(${hueDeg}deg)`;
    drawFlower(ctx, currentStage, openness);
    ctx.filter = 'none';
  };

  p.setHeartbeat = v => { heartbeat = v; };
  p.setBloodOxygen = v => { bloodOxygen = v; };
  p.setSkinTemp = v => { skinTemp = v; };
  p.setActivity = v => { activity = v; };
  p.setStage = key => { currentStage = key; };
};

window.flowerSketch = new p5(sketch);

function bindSlider(id, valId, unit, setter, isFloat) {
  const el = document.getElementById(id);
  const out = document.getElementById(valId);
  el.addEventListener('input', () => {
    const v = isFloat ? parseFloat(el.value) : parseInt(el.value, 10);
    out.textContent = v + unit;
    setter(v);
  });
}
bindSlider('hr', 'hr-val', ' bpm', v => window.flowerSketch.setHeartbeat(v), false);
bindSlider('ox', 'ox-val', '', v => window.flowerSketch.setBloodOxygen(v), false);
bindSlider('temp', 'temp-val', '\u2103', v => window.flowerSketch.setSkinTemp(v), true);
bindSlider('act', 'act-val', '', v => window.flowerSketch.setActivity(v), false);

document.querySelectorAll('#stage-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#stage-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.flowerSketch.setStage(btn.dataset.stage);
  });
});
</script>
